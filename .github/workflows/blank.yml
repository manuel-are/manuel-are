name: generate animation
on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # genera el snake usando nuestro propio script (sin depender de Platane/snk)
      - name: generate github-contribution-grid-snake.svg
        run: |
          node scripts/generate-snake.mjs ${{ github.repository_owner }} dist/github-contribution-grid-snake.svg
          node scripts/generate-snake.mjs ${{ github.repository_owner }} dist/github-contribution-grid-snake-dark.svg --dark

      # push the content of <build_dir> to a branch
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
